name: release

# Code stays in this private repo; the installer and latest.json go to the public
# BySzx/ilhabox-releases, which is where the IlhaBox looks for updates.
# Runs when the version changes (tauri.conf.json): pushing a tag isn't needed.
on:
  push:
    branches: [main]
    paths: ['src-tauri/tauri.conf.json', '.github/workflows/release.yml']
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # The runner image already has the Android SDK (ANDROID_HOME).
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build the phone app
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  windows:
    needs: android
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk

      - name: Put the phone app inside the installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/resources | Out-Null
          Copy-Item apk/app-release.apk src-tauri/resources/ilhabox.apk -Force

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          owner: BySzx
          repo: ilhabox-releases
          releaseCommitish: main
          tagName: v__VERSION__
          releaseName: 'IlhaBox v__VERSION__'
          releaseBody: 'Instale no PC do trabalho. Quem já tem atualiza pelo botão no celular ou em Ajustes › Sistema.'
          releaseDraft: false
          prerelease: false
          args: --config src-tauri/tauri.release.json
